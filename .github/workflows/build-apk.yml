name: Build Personal Vault APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="personal-vault-android-verified.zip"

          test -f "$ARCHIVE"

          rm -rf .ci-project
          mkdir -p .ci-project

          unzip -q "$ARCHIVE" -d .ci-project

          PROJECT_ROOT=".ci-project/personal-vault-android/android"

          test -d "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$PROJECT_ROOT"

          test -f "$ROOT/settings.gradle"
          test -f "$ROOT/build.gradle"
          test -f "$ROOT/app/build.gradle"
          test -f "$ROOT/app/src/main/AndroidManifest.xml"
          test -f "$ROOT/app/src/main/assets/index.html"
          test -f "$ROOT/app/src/main/assets/app.js"
          test -f "$ROOT/app/src/main/assets/styles.css"
          test -f "$ROOT/app/src/main/java/com/personalvault/app/MainActivity.java"

          ! test -f "$ROOT/app/src/main/java/com/personalvault/app/AssetHttpServer.java"

          ! grep -R "127.0.0.1:27843" \
            -n "$ROOT/app/src/main/java" \
               "$ROOT/app/src/main/assets"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-vault-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
